project:
  name: footcast
  environment: development
  timezone: UTC

football:
  competition_code: PL
  competition_name: Premier League
  country: England

api:
  base_url: https://api.football-data.org/v4
  timeout_seconds: 30
  maximum_retries: 3
  retry_wait_seconds: 5

historical_data:
  provider: football-data.co.uk
  base_url: https://www.football-data.co.uk/mmz4281
  division_code: E0
  start_season: 2019
  end_season: 2025

data:
  bronze_directory: data/bronze
  silver_directory: data/silver
  gold_directory: data/gold

logging:
  level: INFO
  file: logs/footcast.log