name: Docker

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/**
      - .github/workflows/docker.yml

  push:
    branches:
      - main
      - develop
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - scripts/**
      - .github/workflows/docker.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: false
          load: true
          tags: footcast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run package health check
        run: |
          docker run \
            --rm \
            footcast:ci \
            python scripts/container_healthcheck.py

      - name: Verify non-root user
        run: |
          user_id="$(
            docker run \
              --rm \
              footcast:ci \
              id -u
          )"

          test "${user_id}" = "10001"

      - name: Verify prediction CLI imports
        run: |
          docker run \
            --rm \
            footcast:ci \
            python \
            -m \
            footcast.prediction.predict \
            --help